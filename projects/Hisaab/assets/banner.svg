<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Hisaab — spend it where it returns: ad budget optimization on big data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#131a3a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect x="0" y="292" width="1200" height="8" fill="url(#accent)"/>

  <!-- decorative budget bars (allocation shares) -->
  <g opacity="0.10">
    <rect x="860" y="60" width="290" height="14" rx="7" fill="#6366f1"/>
    <rect x="860" y="60" width="190" height="14" rx="7" fill="#818cf8"/>
    <rect x="860" y="88" width="290" height="14" rx="7" fill="#6366f1"/>
    <rect x="860" y="88" width="80"  height="14" rx="7" fill="#22d3ee"/>
    <rect x="860" y="116" width="290" height="14" rx="7" fill="#6366f1"/>
    <rect x="860" y="116" width="130" height="14" rx="7" fill="#a5b4fc"/>
    <rect x="860" y="144" width="290" height="14" rx="7" fill="#6366f1"/>
    <rect x="860" y="144" width="18"  height="14" rx="7" fill="#22d3ee"/>
  </g>

  <!-- water-filling curve -->
  <g transform="translate(850,190)" opacity="0.16">
    <path d="M0 90 C 60 88, 110 70, 150 40 C 190 12, 230 4, 270 2" stroke="#22d3ee" stroke-width="4" fill="none"/>
    <path d="M0 90 C 60 88, 110 70, 150 40 C 190 12, 230 4, 270 2 L 270 100 L 0 100 Z" fill="#6366f1" opacity="0.5"/>
  </g>

  <!-- coin logo -->
  <g transform="translate(64,74)">
    <rect x="0" y="0" width="152" height="152" rx="34" fill="url(#coin)"/>
    <text x="76" y="103" text-anchor="middle" font-family="Noto Nastaliq Urdu, Noto Sans Arabic, serif" font-size="64" font-weight="700" fill="#0b1020">حساب</text>
  </g>

  <text x="250" y="128" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">Hisaab</text>
  <text x="252" y="168" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#c7d2fe">Spend it where it returns — ad budget optimization on big data</text>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#a5b4fc">
    <text x="252" y="212">▸ Pandas · Polars · MapReduce · PySpark — one contract, honest benchmarks</text>
    <text x="252" y="238">▸ Saturation curves + water-filling allocation (L3)</text>
    <text x="252" y="264">▸ Raye sentiment bridge — 210,511 comments of brand voice</text>
  </g>
</svg>
